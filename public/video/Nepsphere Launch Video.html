<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nepsphere — Launch video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap">
<style>
  html, body { margin: 0; background: #1A1714; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { color: #1A1714; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px; gap: 16px; }
  .toolbar { display: flex; gap: 8px; color: #FAFAF7; }
  .toolbar button {
    background: #2A2520; color: #FAFAF7; border: 1px solid #3A3530;
    border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .toolbar button.active { background: #EA580C; border-color: #EA580C; }
  .stage-wrap { box-shadow: 0 30px 80px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div class="toolbar">
  <button id="btn-16" class="active">16:9 (1920×1080)</button>
  <button id="btn-9">9:16 (1080×1920)</button>
</div>
<div id="root"></div>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel">
  const params = new URLSearchParams(location.search);
  const initialVertical = params.get('v') === '9x16';

  function App() {
    const [vertical, setVertical] = React.useState(initialVertical);
    React.useEffect(() => {
      document.getElementById('btn-16').classList.toggle('active', !vertical);
      document.getElementById('btn-9').classList.toggle('active', vertical);
      document.getElementById('btn-16').onclick = () => setVertical(false);
      document.getElementById('btn-9').onclick = () => setVertical(true);
    }, [vertical]);

    const W = vertical ? 1080 : 1920;
    const H = vertical ? 1920 : 1080;
    return (
      <div className="stage-wrap" key={vertical ? 'v' : 'h'}>
        <Stage width={W} height={H} duration={60} background="#0F0F0E" autoplay={true} loop={true}>
          <SceneOpen vertical={vertical}/>
          <SceneCommunity vertical={vertical}/>
          <SceneRooms vertical={vertical}/>
          <SceneConnect vertical={vertical}/>
          <SceneJobs vertical={vertical}/>
          <SceneVerified vertical={vertical}/>
          <SceneValues vertical={vertical}/>
          <SceneClose vertical={vertical}/>
        </Stage>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
